[project]
name = "ai-document-intelligence"
version = "0.1.0"
description = "OCR, extraction, RAG et agent SQL pour factures marocaines"
requires-python = ">=3.11"
dependencies = [
    "pytesseract>=0.3.10",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "numpy>=1.26",
    "jiwer>=3.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "typesafe-sdk>=0.7.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "rank-bm25>=0.2.2",
    "langfuse>=3.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
synthetic-data = [
    "reportlab>=4.0",
]
# PaddleOCR nécessite un environnement Python séparé (voir README "Environnements
# Python") : paddlepaddle n'a pas de wheel pour Python 3.14, et cette combinaison
# de versions est la seule testée qui fonctionne en CPU sur macOS x86_64 sans
# planter sur le nouveau backend d'inférence PIR (paddlepaddle 3.x) ni sur des
# conflits d'ABI numpy (scipy/scikit-image récents exigent numpy>=2).
paddleocr = [
    "paddlepaddle==2.6.2",
    "paddleocr==2.7.3",
    "numpy<2",
    "opencv-python-headless==4.9.0.80",
    "scipy==1.11.4",
    "scikit-image==0.22.0",
    "pypdfium2>=4.30",
    "jiwer>=3.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["src*", "db*"]

[tool.pytest.ini_options]
markers = [
    "requires_llm: appelle une vraie API LLM et suppose le jeu de 200 factures déjà ingéré (docs/eval) — non reproductible en CI, exécuté seulement en local",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query() sont le pattern d'injection de dépendances standard de
# FastAPI (évalués et mis en cache par le framework) — pas le bug de
# "mutable default argument" que B008 détecte normalement.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
