server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend FastAPI sous /api/ — préfixe dédié, distinct des routes
    # frontend (/upload, /chat, /admin, /documents existent des deux côtés :
    # sans préfixe, une navigation directe vers /upload proxifiait vers
    # l'API au lieu de servir la page React, 405 sur GET).
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # SPA : toute route inconnue retombe sur index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
