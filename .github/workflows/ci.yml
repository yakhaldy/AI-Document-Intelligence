name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # DB CI éphémère (détruite en fin de job) — ces valeurs n'existent nulle
  # part ailleurs, elles ne sont pas des secrets à protéger.
  POSTGRES_DB: ai_doc_intelligence_ci
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ci-only-password
  AGENT_DB_PASSWORD: ci-only-agent-password
  DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/ai_doc_intelligence_ci
  AGENT_DATABASE_URL: postgresql+psycopg://rag_agent:ci-only-agent-password@localhost:5432/ai_doc_intelligence_ci
  JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes-long-for-hs256
  # tests/test_api.py suppose ce compte précis (même identifiants qu'en dev
  # local) — voir la fixture `token`.
  ADMIN_USERNAME: demo
  ADMIN_PASSWORD_HASH: $2b$12$WSawWyuKuMGmdvAcu45GQuUhYjPCaQV1w97rj8q8phuDrPiemnBE.

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_doc_intelligence_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_doc_intelligence_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances (+ tesseract pour les tests OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra
          pip install -e ".[dev]"
          pip install ruff==0.16.8

      - name: Lint (ruff, dette pré-existante grandfathered via .lint-baseline.json)
        run: python scripts/check_ruff_baseline.py

      - name: Migrations + fixtures CI (sans OCR/LLM)
        run: |
          alembic upgrade head
          python -m db.seed_admin
          python -m db.seed_ci_fixture

      - name: Tests (hors requires_llm — voir pyproject.toml)
        run: pytest -m "not requires_llm" -v

      - name: Build de l'image Docker API (validation, pas de push)
        run: docker build -t adi-api:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Build de l'image Docker frontend (validation, pas de push)
        run: docker build -t adi-frontend:ci .
